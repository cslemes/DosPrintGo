name: Release and Code Signing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build & Sign Windows Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies (windres for cross-compilation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-mingw-w64-x86-64 binutils-mingw-w64-i686

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Test Suite
        run: go test -v ./...

      - name: Compile Windows Resources (.syso)
        run: make resources

      - name: Compile Windows Binaries (x64 and x86)
        run: make build

      - name: Upload Unsigned Binaries for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            dist/DosPrintGo.exe
            dist/DosPrintGo_x86.exe
          retention-days: 1

      - name: Submit Code Signing Request to SignPath Foundation
        id: signpath
        if: env.HAS_SIGNPATH == 'true'
        env:
          HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'DosPrintGo'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './dist-signed'

      - name: Prepare Final Binaries for Release
        run: |
          mkdir -p release-artifacts
          if [ -d "./dist-signed" ] && [ "$(ls -A ./dist-signed 2>/dev/null)" ]; then
            echo ">> Using SignPath-signed binaries"
            cp -v ./dist-signed/*.exe release-artifacts/
          else
            echo ">> SignPath token not set or pending; using compiled binaries"
            cp -v dist/*.exe release-artifacts/
          fi
          ls -la release-artifacts/

      - name: Create GitHub Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
